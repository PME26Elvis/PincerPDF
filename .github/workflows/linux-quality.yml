name: Linux quality

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/linux-quality.yml"
      - ".cargo/**"
      - "apps/**"
      - "crates/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Makefile"

permissions:
  contents: read

concurrency:
  group: linux-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"
  RUST_BACKTRACE: "1"

jobs:
  rust-foundation:
    name: Rust foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify repository structure
        run: make verify-structure

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 \
            --profile minimal \
            --component clippy \
            --component rustfmt \
            --target wasm32-unknown-unknown
          rustup default 1.97.1

      - name: Record tool versions
        run: |
          rustc --version --verbose
          cargo --version --verbose
          cargo clippy --version
          cargo fmt --version

      - name: Run Rust quality gate
        run: make check-fast

      - name: Run CLI smoke tests
        run: |
          cargo run --locked --quiet -p pincerpdf-cli -- doctor
          selection="$(cargo run --locked --quiet -p pincerpdf-cli -- selection '1-3,8' 10)"
          test "$selection" = "1,2,3,8"

      - name: Ensure validation did not modify tracked files
        run: git diff --exit-code
