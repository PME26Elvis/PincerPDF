name: P4 apply initial Clippy fixes

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/p4-clippy-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out P4 branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply exact source fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("crates/pincerpdf-merge/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          if text.count("Duration::from_secs(120)") != 1:
              raise SystemExit("expected timeout expression was not found exactly once")
          text = text.replace("Duration::from_secs(120)", "Duration::from_mins(2)")
          pattern = re.compile(
              r"(?m)^(?P<i>\s*)if let Ok\(canonical_source\) = source\.path\(\)\.canonicalize\(\) \{\n"
              r"(?P=i)    if canonical_source == output_candidate \{\n"
              r"(?P=i)        return Err\(MergeError::OutputAliasesSource \{ source_index \}\);\n"
              r"(?P=i)    \}\n"
              r"(?P=i)\}\n"
          )
          replacement = (
              r"\g<i>if let Ok(canonical_source) = source.path().canonicalize()\n"
              r"\g<i>    && canonical_source == output_candidate\n"
              r"\g<i>{\n"
              r"\g<i>    return Err(MergeError::OutputAliasesSource { source_index });\n"
              r"\g<i>}\n"
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("expected canonical alias check was not found exactly once")
          path.write_text(text, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/pincerpdf-merge/src/lib.rs
          git commit -m "Fix initial P4.1 Clippy findings"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
