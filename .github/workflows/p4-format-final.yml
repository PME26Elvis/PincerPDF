name: P4 final Rust format

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/p4-format-final.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out P4 branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pinned Rust formatter
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - name: Format and commit Rust source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          if git diff --cached --quiet; then
            echo "Rust source already formatted"
            exit 0
          fi
          git commit -m "Format final P4.1 Rust source"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
