name: P4 apply QPDF quality fixes

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/p4-qpdf-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out P4 branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply exact QPDF fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/pincerpdf-engine-qpdf/src/lib.rs")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "//! Process-isolated QPDF adapter for proven PincerPDF capabilities.",
                  "//! Process-isolated QPDF adapter for proven `PincerPDF` capabilities.",
                  1,
              ),
              (
                  "    CommandEvidence, ExecutionControl, MergeEnginePort, MergeEngineRequest, MergeEngineResult,\n",
                  "    CancellationToken, CommandEvidence, ExecutionControl, MergeEnginePort, MergeEngineRequest,\n    MergeEngineResult,\n",
                  1,
              ),
              ("                Default::default(),", "                CancellationToken::default(),", 1),
              (
                  "                Err(error) if error.kind() == io::ErrorKind::AlreadyExists => continue,",
                  "                Err(error) if error.kind() == io::ErrorKind::AlreadyExists => {}",
                  1,
              ),
              ("enum ProcessFailureKind {", "#[derive(Clone, Copy, Debug)]\nenum ProcessFailureKind {", 1),
              (
                  "struct ProcessFailure {\n    kind: ProcessFailureKind,\n    evidence: CommandEvidence,\n    message: String,\n}",
                  "#[derive(Debug)]\nstruct ProcessFailure {\n    kind: ProcessFailureKind,\n    evidence: Box<CommandEvidence>,\n    message: String,\n}",
                  1,
              ),
              ("map_process_failure(failure, false)", "map_process_failure(&failure, false)", 1),
              (
                  "map_process_failure(failure, password_supplied)",
                  "map_process_failure(&failure, password_supplied)",
                  1,
              ),
              (
                  "fn map_process_failure(failure: ProcessFailure, password_supplied: bool) -> EngineError {",
                  "fn map_process_failure(failure: &ProcessFailure, password_supplied: bool) -> EngineError {",
                  1,
              ),
              (
                  "evidence: empty_evidence(program, display_args.clone(), started.elapsed()),",
                  "evidence: Box::new(empty_evidence(program, display_args.clone(), started.elapsed())),",
                  4,
              ),
              (
                  "        return Err(ProcessFailure {\n            kind,\n            evidence,\n            message: message.to_owned(),\n        });\n",
                  "        return Err(ProcessFailure {\n            kind,\n            evidence: Box::new(evidence),\n            message: message.to_owned(),\n        });\n",
                  1,
              ),
              (
                  "            evidence,\n        })\n",
                  "            evidence: Box::new(evidence),\n        })\n",
                  1,
              ),
          ]
          for old, new, expected in replacements:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"expected {old!r} {expected} time(s), found {count}")
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/pincerpdf-engine-qpdf/src/lib.rs
          git commit -m "Fix P4.1 QPDF quality findings"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
