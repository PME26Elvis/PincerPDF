name: Refresh P3 locks once

on:
  push:
    branches:
      - fix/p3-application-shell-verification
    paths:
      - ".github/workflows/refresh-p3-locks-once.yml"

permissions:
  contents: write

concurrency:
  group: refresh-p3-locks-once
  cancel-in-progress: false

jobs:
  refresh-locks:
    name: Generate, commit, and remove one-time lock refresher
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/p3-application-shell-verification
          persist-credentials: true

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Install pinned Node runtime
        uses: actions/setup-node@v6
        with:
          node-version: 22.16.0

      - name: Generate exact dependency locks
        run: |
          set -euo pipefail
          cargo generate-lockfile
          npm install --package-lock-only --ignore-scripts
          test -s Cargo.lock
          test -s package-lock.json

      - name: Commit locks and self-remove
        run: |
          set -euo pipefail
          rm .github/workflows/refresh-p3-locks-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock package-lock.json .github/workflows/refresh-p3-locks-once.yml
          git commit -m "chore(deps): lock P3 application-shell dependencies"
          git push origin HEAD:fix/p3-application-shell-verification
