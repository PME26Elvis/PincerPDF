[workspace]
resolver = "3"
members = [
  "apps/pincerpdf-cli",
  "apps/pincerpdf-desktop/src-tauri",
  "apps/pincerpdf-ui",
  "crates/pincerpdf-application",
  "crates/pincerpdf-domain",
  "crates/pincerpdf-engine-api",
  "crates/pincerpdf-engine-qpdf",
  "crates/pincerpdf-filesystem",
  "crates/pincerpdf-merge",
]
default-members = [
  "apps/pincerpdf-cli",
  "apps/pincerpdf-desktop/src-tauri",
  "apps/pincerpdf-ui",
  "crates/pincerpdf-application",
  "crates/pincerpdf-domain",
  "crates/pincerpdf-engine-api",
  "crates/pincerpdf-engine-qpdf",
  "crates/pincerpdf-filesystem",
  "crates/pincerpdf-merge",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "AGPL-3.0-or-later"
repository = "https://github.com/PME26Elvis/PincerPDF"
authors = ["PincerPDF contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.dev]
debug = 1
incremental = true

[profile.test]
debug = 1
incremental = true

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
